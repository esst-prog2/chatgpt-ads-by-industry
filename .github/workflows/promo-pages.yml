# Publishes the promo page (public/promo.html) to GitHub Pages at
# https://<owner>.github.io/<repo>/ with its logos, promo video and the static
# demo dashboard (public/demo/, illustrative data) and the presentation
# (slides/index.html + slides/assets/, served at /slides/) - nothing else
# from the repository.
#
# One-time setup in the repository's GitHub settings:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Optional: Settings > Secrets and variables > Actions > Variables:
#      DASHBOARD_URL = the live dashboard's public address. Only needed if
#      promo.html links the live app (href="/?metric=cpc"); such links are
#      rewritten to DASHBOARD_URL/?metric=cpc. The main button points at the
#      static demo (demo/index.html) and needs no rewrite.
name: Publish promo page

on:
  push:
    branches: [main]
    paths:
      - public/promo.html
      - public/images/brand-logo.png
      - public/images/logo_fekv*-09.png
      - public/promo-video.mp4
      - public/promo-video-poster.jpg
      - public/demo/**
      - slides/index.html
      - slides/assets/**
      - .github/workflows/promo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site (promo page + logos only)
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          mkdir -p _site/images
          cp public/images/brand-logo.png public/images/logo_fekv*-09.png _site/images/
          cp public/promo-video.mp4 public/promo-video-poster.jpg _site/
          # Static, login-free demo dashboard (illustrative data only; see demo-dashboard/).
          cp -R public/demo _site/demo
          test -s _site/demo/index.html && test -s _site/demo/data.js
          # 5-minute presentation (reveal.js) and its images, served at /slides/.
          # slides/capture/ is the screenshot tooling, not part of the site.
          cp -R slides _site/slides
          rm -rf _site/slides/capture
          test -s _site/slides/index.html && test -d _site/slides/assets/demo
          touch _site/.nojekyll
          python3 - <<'PY'
          import os
          url = os.environ.get("DASHBOARD_URL", "").rstrip("/")
          html = open("public/promo.html", encoding="utf-8").read()
          old = 'href="/?metric=cpc"'
          if old in html:
              if not url:
                  raise SystemExit("promo.html links the live dashboard: set the DASHBOARD_URL repository variable.")
              html = html.replace(old, 'href="' + url.replace("&", "&amp;").replace('"', "&quot;") + '/?metric=cpc"')
          if 'href="demo/index.html' not in html:
              raise SystemExit("Expected the promo page's button to link the demo (demo/index.html).")
          open("_site/index.html", "w", encoding="utf-8").write(html)
          # Also as promo.html, the path it has in the Laravel app, so links such as
          # the demo's "Back to the promo page" (../promo.html) work on Pages too.
          open("_site/promo.html", "w", encoding="utf-8").write(html)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
